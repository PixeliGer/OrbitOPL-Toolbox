<div class="abd-backdrop" (click)="close()"></div>
<div class="abd-modal glass-strong" role="dialog" aria-modal="true">
  <div class="flex items-center gap-2 border-b border-base-content/10 px-5 py-3">
    <i-lucide name="image-down" size="18" class="text-accent"></i-lucide>
    <div class="min-w-0">
      <h2 class="truncate font-display text-sm font-semibold tracking-wide">
        Download artwork
      </h2>
      <p class="truncate font-mono text-[0.68rem] text-base-content/50">
        {{ gameCount() }} game(s) in library
      </p>
    </div>
    <button class="btn btn-ghost btn-xs btn-square ml-auto" (click)="close()">
      <i-lucide name="x" size="16"></i-lucide>
    </button>
  </div>

  <div class="abd-body flex flex-col gap-4 px-5 py-4">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Presets</legend>
      <div class="flex flex-wrap gap-2">
        @for (preset of presets; track preset.id) {
          <button class="btn btn-xs" (click)="applyPreset(preset.types)">
            {{ preset.label }}
          </button>
        }
        <button class="btn btn-xs btn-ghost" (click)="selectAll()">All</button>
        <button class="btn btn-xs btn-ghost" (click)="deselectAll()">None</button>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Art types</legend>
      <div class="grid grid-cols-2 gap-1.5 sm:grid-cols-3">
        @for (type of knownTypes; track type) {
          <label
            class="flex cursor-pointer items-center gap-2 rounded-md p-2 hover:bg-base-100/40"
          >
            <input
              type="checkbox"
              class="checkbox checkbox-sm checkbox-primary"
              [checked]="isSelected(type)"
              (change)="toggle(type)"
            />
            <span class="text-sm">{{ artTypeLabel(type) }}</span>
            <span class="font-mono text-[0.65rem] text-base-content/40">{{ type }}</span>
          </label>
        }
      </div>
    </fieldset>

    <p class="flex items-center gap-2 text-xs text-base-content/45">
      <i-lucide name="info" size="13"></i-lucide>
      Types missing from the art database for a given game are skipped automatically.
    </p>
  </div>

  <div class="flex items-center justify-between gap-2 border-t border-base-content/10 px-5 py-3">
    <span class="text-xs text-base-content/50">{{ selectedCount() }} type(s) selected</span>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" (click)="close()">Cancel</button>
      <button
        class="btn btn-primary btn-sm"
        [disabled]="selectedCount() === 0"
        (click)="submit()"
      >
        <i-lucide name="download" size="15"></i-lucide>
        Queue {{ gameCount() }} game(s)
      </button>
    </div>
  </div>
</div>
